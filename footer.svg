<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 218" width="960" height="218" role="img" aria-label="The best way to predict the future is to build it, one commit at a time." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#00C7B7" stop-opacity="0"/><stop offset=".5" stop-color="#00C7B7" stop-opacity=".8"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></linearGradient></defs>
<rect width="960" height="218" rx="20" fill="#07090D"/><rect x=".5" y=".5" width="959" height="217" rx="19.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/><g transform="translate(30,24)">
<rect x="0" y="14" width="900" height="1.5" fill="url(#fl)"/>
<circle r="3.5" cy="14.75" fill="#F4F7F8"><animate attributeName="cx" from="0" to="900" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" repeatCount="indefinite"/></circle>
<text x="450" y="72" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic" fill="#F4F7F8">the best way to predict the future is to build it,</text>
<text x="450" y="106" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" font-style="italic" fill="#00C7B7">one commit at a time.</text>
<text x="450" y="146" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3" fill="#5B6B73">FROM BUILDING INTERFACES TO BUILDING INTELLIGENCE</text></g>
</svg>
