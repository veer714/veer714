<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Veer Pratap Singh — machine learning, DSA, Python. An animated loss curve converging." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#0E1920"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="0.45" stop-color="#FFD08A"/>
      <stop offset="1" stop-color="#00C7B7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.88" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#00C7B7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00C7B7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="400" rx="18" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- left: identity -->
  <text x="64" y="96" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#00C7B7">// ml engineer, in training</text>
  <text x="64" y="188" font-family="Georgia,'Times New Roman',serif" font-size="74" fill="#F4F7F8">Veer Pratap</text>
  <text x="64" y="268" font-family="Georgia,'Times New Roman',serif" font-size="74" font-style="italic" fill="#00C7B7">Singh</text>
  <text x="66" y="322" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="1.5" fill="#8FA3AD">machine learning  ·  dsa  ·  python</text>

  <!-- right: loss curve -->
  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="11" fill="#5B6B73">
    <line x1="580" y1="70" x2="580" y2="320" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <line x1="580" y1="320" x2="1140" y2="320" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="580" y="56" letter-spacing="1.5">loss</text>
    <text x="1140" y="344" text-anchor="end" letter-spacing="1.5">epochs →</text>
    <text x="580" y="344" letter-spacing="1.5">web dev</text>
    <text x="860" y="344" text-anchor="middle" letter-spacing="1.5">data</text>
  </g>

  <!-- validation curve -->
  <path d="M580 100 C620 105,635 225,675 190 S725 262,765 232 S825 268,875 250 S945 272,1005 266 S1085 272,1140 270"
        fill="none" stroke="#FFFFFF" stroke-opacity="0" stroke-width="1.5" stroke-dasharray="4 6">
    <animate attributeName="stroke-opacity" from="0" to="0.28" begin="1.5s" dur="2s" fill="freeze"/>
  </path>

  <!-- training curve (draws itself) -->
  <path d="M580 110 C620 120,630 250,670 200 S720 282,760 242 S820 287,870 264 S940 292,1000 282 S1080 290,1140 286"
        fill="none" stroke="url(#curve)" stroke-width="3.5" stroke-linecap="round"
        pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.3s" dur="4s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.3 0.1 0.2 1"/>
  </path>

  <!-- converged point -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.2s" dur="0.6s" fill="freeze"/>
    <circle cx="1140" cy="286" r="6" fill="#00C7B7" filter="url(#glow)"/>
    <circle cx="1140" cy="286" r="6" fill="none" stroke="#00C7B7" stroke-width="1.5">
      <animate attributeName="r" values="6;22" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="1126" y="262" text-anchor="end" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#00C7B7">converging</text>
  </g>
</svg>
