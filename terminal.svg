<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Terminal showing a script loading Veer's toolkit and training progress." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#00C7B7"/>
    </linearGradient>
  </defs>

  <rect width="880" height="290" rx="14" fill="#0B0F14"/>
  <rect x="0.5" y="0.5" width="879" height="289" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <circle cx="28" cy="22" r="5.5" fill="#FF8A5B" fill-opacity="0.9"/>
  <circle cx="48" cy="22" r="5.5" fill="#FFD08A" fill-opacity="0.9"/>
  <circle cx="68" cy="22" r="5.5" fill="#00C7B7" fill-opacity="0.9"/>
  <text x="440" y="26" text-anchor="middle" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#5B6B73">veer — zsh — 80×24</text>

  <g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="15">
    <!-- 1 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.2s" fill="freeze"/>
      <text x="32" y="86" fill="#00C7B7">$</text>
      <text x="52" y="86" fill="#E6EEF1">python hello.py</text>
    </g>
    <!-- 2 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.2s" fill="freeze"/>
      <text x="32" y="124" fill="#5B6B73">›</text>
      <text x="52" y="124" fill="#8FA3AD">loading toolkit</text>
      <text x="270" y="124" fill="#E6EEF1">c · c++ · python · django · javascript</text>
    </g>
    <!-- 3 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.2s" fill="freeze"/>
      <text x="32" y="154" fill="#5B6B73">›</text>
      <text x="52" y="154" fill="#8FA3AD">fitting model</text>
      <text x="270" y="154" fill="#E6EEF1">scikit-learn</text>
      <text x="820" y="154" text-anchor="end" fill="#5EE6A8">✓ done</text>
    </g>
    <!-- 4 -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.2s" fill="freeze"/>
      <text x="32" y="184" fill="#5B6B73">›</text>
      <text x="52" y="184" fill="#8FA3AD">solving dsa</text>
      <text x="270" y="184" fill="#E6EEF1">1 problem / day, no days off</text>
    </g>
    <!-- 5: progress -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.2s" fill="freeze"/>
      <text x="32" y="214" fill="#5B6B73">›</text>
      <text x="52" y="214" fill="#8FA3AD">learning</text>
      <rect x="270" y="202" width="400" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="270" y="202" width="0" height="8" rx="4" fill="url(#bar)">
        <animate attributeName="width" from="0" to="300" begin="3.8s" dur="2.4s" fill="freeze"/>
      </rect>
      <text x="690" y="212" fill="#00C7B7" font-size="13">ongoing</text>
    </g>
    <!-- prompt + cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.2s" fill="freeze"/>
      <text x="32" y="254" fill="#00C7B7">$</text>
      <rect x="52" y="240" width="9" height="18" fill="#00C7B7">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
